<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCG-Dash Telemetry</title>
    <script src="charts.js"></script>
  <!-- use local script file -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .metric { font-size: 2rem; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .threat-alert { color: #f87171 !important; }
        h3 { margin-top: 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        canvas { max-height: 180px; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 30px;">UCG Server-Side Metrics Dashboard</h2>
    
    <div class="grid">
        <!-- Live Stat Counters -->
        <div class="card">
            <h3>System Status</h3>
            <div id="live-cpu" class="metric">0%</div>
            <p>CPU Load</p>
            <div id="live-temp" class="metric" style="color: #fbbf24;">0°C</div>
            <p>Core Temperature</p>
        </div>

        <div class="card">
            <h3>Security Metrics</h3>
            <div id="live-threat-hr" class="metric threat-alert">0 / hr</div>
            <p>Hourly Threat Rate</p>
            <div id="live-threat-day" class="metric style="color: #ef4444;">0 / day</div>
            <p>Daily Threat Rate</p>
        </div>

        <!-- Historical Charts -->
        <div class="card" style="grid-column: span 2;">
            <h3>Resource Usage History</h3>
            <canvas id="resourceChart"></canvas>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://10.0.0.100'; 

        const ctx = document.getElementById('resourceChart').getContext('2d');
        const resourceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'CPU Load (%)', data: [], borderColor: '#38bdf8', tension: 0.2 },
                    { label: 'Temp (°C)', data: [], borderColor: '#fbbf24', tension: 0.2 },
                    { label: 'Threats/Hr (Rate)', data: [], borderColor: '#f87171', tension: 0.2 }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { display: false },
                    y: { type: 'linear', display: true, min: 0 }
                },
                plugins: { legend: { labels: { color: '#94a3b8' } } }
            }
        });

        async function pollMetrics() {
            try {
                const res = await fetch(BACKEND_URL);
                const history = await res.json();
                if (!history.length) return;

                const latest = history[history.length - 1];

                // Render rates directly on UI elements
                document.getElementById('live-cpu').innerText = `${latest.cpu_load}%`;
                document.getElementById('live-temp').innerText = `${latest.temperature_c}°C`;
                document.getElementById('live-threat-hr').innerText = `${latest.threat_rate_hour} / hr`;
                document.getElementById('live-threat-day').innerText = `${latest.threat_rate_day} / day`;

                // Update Chart paths
                resourceChart.data.labels = history.map(d => new Date(d.timestamp * 1000).toLocaleTimeString());
                resourceChart.data.datasets[0].data = history.map(d => d.cpu_load);
                resourceChart.data.datasets[1].data = history.map(d => d.temperature_c);
                resourceChart.data.datasets[2].data = history.map(d => d.threat_rate_hour);
                resourceChart.update('none');
                
            } catch (err) {
                console.error("Dashboard synchronization error:", err);
            }
        }

        pollMetrics();
        setInterval(pollMetrics, 10000);
    </script>
</body>
</html>
