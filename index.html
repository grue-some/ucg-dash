<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCG-Dash Telemetry</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 20px; }
        .layout-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .left-stack { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .system-card { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .security-card { display: flex; flex-direction: column; justify-content: center; }
        .full-width-card { grid-column: span 2; }
        .metric { font-size: 2rem; font-weight: bold; color: #38bdf8; margin: 0; }
        .threat-alert { color: #f87171 !important; }
        .threat-sub { font-size: 2.5rem; margin-bottom: 10px; }
        h3 { margin: 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .graph-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .btn-toggle { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-toggle:hover { background: #475569; }
        .btn-toggle.active { background: #38bdf8; color: #0f172a; }
        
        .time-range { font-size: 0.8rem; color: #64748b; margin-top: 5px; font-weight: normal; }
        canvas { max-height: 240px; }
        @media (max-width: 768px) {
            .layout-container { grid-template-columns: 1fr; }
            .full-width-card { grid-column: span 1; }
            .graph-header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 30px;">UCG Server-Side Metrics Dashboard</h2>
    
    <div class="layout-container">
        <!-- Left Side: Stacked Hardware Cards with subtitles removed -->
        <div class="left-stack">
            <div class="card system-card">
                <div>
                    <h3>CPU Load</h3>
                </div>
                <div id="live-cpu" class="metric">0%</div>
            </div>
            
            <div class="card system-card">
                <div>
                    <h3>Core Temperature</h3>
                </div>
                <div id="live-temp" class="metric" style="color: #fbbf24;">0°C</div>
            </div>
            
            <div class="card system-card">
                <div>
                    <h3>Memory Usage</h3>
                </div>
                <div id="live-ram" class="metric" style="color: #34d399;">0%</div>
            </div>
        </div>

        <div class="card security-card">
            <div style="margin-bottom: 20px;">
                <h3>Hourly Threat Rate</h3>
                <div id="live-threat-hr" class="metric threat-alert threat-sub">0 / hr</div>
            </div>
            <div>
                <h3>Daily Threat Rate</h3>
                <div id="live-threat-day" class="metric" style="color: #ef4444; font-size: 1.5rem;">0 / day</div>
            </div>
        </div>

        <div class="card full-width-card">
            <div class="graph-header">
                <div>
                    <h3>Resource Usage History</h3>
                    <div id="graph-time-range" class="time-range">Awaiting data loop...</div>
                </div>
                <div>
                    <button id="btn-live" class="btn-toggle active" onclick="setViewMode('live')">Real-time (10s)</button>
                    <button id="btn-24h" class="btn-toggle" onclick="setViewMode('24h')">24 Hours (5m)</button>
                </div>
            </div>
            <canvas id="resourceChart"></canvas>
        </div>
    </div>

    <script>
        let viewMode = 'live'; 

        const ctx = document.getElementById('resourceChart').getContext('2d');
        const resourceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'CPU Load (%)', data: [], borderColor: '#38bdf8', tension: 0.1, pointRadius: 1 },
                    { label: 'Temp (°C)', data: [], borderColor: '#fbbf24', tension: 0.1, pointRadius: 1 },
                    { label: 'RAM (%)', data: [], borderColor: '#34d399', tension: 0.1, pointRadius: 1 },
                    { label: 'Threats/Hr', data: [], borderColor: '#f87171', tension: 0.1, pointRadius: 1 }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { display: false },
                    y: { type: 'linear', display: true, min: 0 }
                },
                plugins: { legend: { labels: { color: '#94a3b8' } } }
            }
        });

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-live').classList.toggle('active', mode === 'live');
            document.getElementById('btn-24h').classList.toggle('active', mode === '24h');
            pollMetrics();
        }

        async function pollMetrics() {
            try {
                const targetUrl = viewMode === 'live' ? '/api/stats' : '/api/stats/24h';
                const res = await fetch(targetUrl);
                let history = await res.json();
                if (!history || !history.length) return;

                const chartData = viewMode === 'live' ? history.slice(-100) : history;
                const latest = history[history.length - 1];

                document.getElementById('live-cpu').innerText = `${latest.cpu_load}%`;
                document.getElementById('live-temp').innerText = `${latest.temperature_c}°C`;
                document.getElementById('live-ram').innerText = `${latest.memory_used_pct}%`;
                document.getElementById('live-threat-hr').innerText = `${latest.threat_rate_hour} / hr`;
                document.getElementById('live-threat-day').innerText = `${latest.threat_rate_day} / day`;

                const firstTime = new Date(chartData[0].timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const lastTime = new Date(latest.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                document.getElementById('graph-time-range').innerText = 
                    `Viewing ${viewMode === 'live' ? 'Real-time window' : '24h history Log'} [${firstTime} - ${lastTime}] (${chartData.length} data points)`;

                resourceChart.data.labels = chartData.map(d => new Date(d.timestamp * 1000).toLocaleTimeString());
                resourceChart.data.datasets[0].data = chartData.map(d => d.cpu_load);
                resourceChart.data.datasets[1].data = chartData.map(d => d.temperature_c);
                resourceChart.data.datasets[2].data = chartData.map(d => d.memory_used_pct);
                resourceChart.data.datasets[3].data = chartData.map(d => d.threat_rate_hour);
                
                resourceChart.update('none');
                
            } catch (err) {
                console.error("Dashboard sync error:", err);
            }
        }

        pollMetrics();
        setInterval(pollMetrics, 10000);
    </script>
</body>
</html>
